<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to BuddyBloc - Find your productivity partner and never work alone again.">
    <title>Login - BuddyBloc</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">

    <!-- Google Material Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <div class="logo-icon">B</div>
                    <span>BuddyBloc</span>
                </a>
                <h1>Welcome Back!</h1>
                <p>Log in to continue your productivity journey</p>
            </div>

            <!-- Social Login -->
            <div class="social-buttons">
                <button class="btn-social" type="button">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M10 0C4.477 0 0 4.477 0 10c0 4.991 3.657 9.128 8.438 9.879V12.89h-2.54V10h2.54V7.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V10h2.773l-.443 2.89h-2.33v6.989C16.343 19.128 20 14.991 20 10c0-5.523-4.477-10-10-10z" />
                    </svg>
                    <span>Google</span>
                </button>
                <button class="btn-social" type="button">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M18.52 0H1.48C.66 0 0 .66 0 1.48v17.04c0 .82.66 1.48 1.48 1.48h17.04c.82 0 1.48-.66 1.48-1.48V1.48C20 .66 19.34 0 18.52 0zM6 17H3V7.5h3V17zM4.5 6.3c-1 0-1.8-.8-1.8-1.8s.8-1.8 1.8-1.8 1.8.8 1.8 1.8-.8 1.8-1.8 1.8zM17 17h-3v-4.7c0-1.1 0-2.5-1.5-2.5s-1.7 1.2-1.7 2.4V17h-3V7.5h2.9v1.3h.1c.4-.8 1.4-1.6 2.8-1.6 3 0 3.6 2 3.6 4.6V17z" />
                    </svg>
                    <span>LinkedIn</span>
                </button>
            </div>

            <div class="auth-divider">
                <span>Or continue with email</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" data-validate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="Enter your password" required data-min-length="6">
                </div>

                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="remember" class="form-checkbox">
                        <span style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">Remember
                            me</span>
                    </label>
                    <a href="#" style="font-size: var(--font-size-sm); color: var(--color-primary-light);">Forgot
                        password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-full" data-original-text="Log In">
                    <span>Log In</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up for free</a></p>
            </div>

            <!-- Trust Indicators -->
            <div
                style="margin-top: var(--spacing-xl); padding-top: var(--spacing-xl); border-top: 1px solid var(--color-border); text-align: center;">
                <p
                    style="font-size: var(--font-size-xs); color: var(--color-text-muted); margin-bottom: var(--spacing-sm);">
                    Trusted by 10,000+ remote professionals
                </p>
                <div style="display: flex; justify-content: center; gap: var(--spacing-md); flex-wrap: wrap;">
                    <div class="badge badge-verified">
                        <span class="material-symbols-outlined" style="font-size: 1rem;">verified_user</span>
                        <span>Secure</span>
                    </div>
                    <div class="badge badge-success">
                        <span class="material-symbols-outlined" style="font-size: 1rem;">lock</span>
                        <span>Encrypted</span>
                    </div>
                    <div class="badge badge-primary">
                        <span class="material-symbols-outlined" style="font-size: 1rem;">shield</span>
                        <span>Privacy First</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>

</html>
