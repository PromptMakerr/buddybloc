<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Feedback &amp; Support</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
      .glossy-button {
        background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%), #427cf0;
        transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
      }
      .glossy-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(66, 124, 240, 0.2);
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#427cf0",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#333333] dark:text-gray-200">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex items-center p-4 pb-2 justify-between bg-background-light dark:bg-background-dark">
<button class="text-[#333333] dark:text-gray-200 flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-[#333333] dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Feedback &amp; Support</h1>
</header>
<main class="flex flex-col flex-grow p-4 space-y-6">
<!-- SegmentedButtons -->
<div class="flex">
<div class="flex h-12 flex-1 items-center justify-center rounded-full bg-white/60 dark:bg-black/20 p-1.5 shadow-[0_2px_8px_rgba(0,0,0,0.05)]">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:shadow-[0_2px_6px_rgba(66,124,240,0.3)] has-[:checked]:text-white text-[#4c669a] dark:text-gray-400 text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">Bug Report</span>
<input checked="" class="invisible w-0" name="feedback-category" type="radio" value="Bug Report"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:shadow-[0_2px_6px_rgba(66,124,240,0.3)] has-[:checked]:text-white text-[#4c669a] dark:text-gray-400 text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">Feature Request</span>
<input class="invisible w-0" name="feedback-category" type="radio" value="Feature Request"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-primary has-[:checked]:shadow-[0_2px_6px_rgba(66,124,240,0.3)] has-[:checked]:text-white text-[#4c669a] dark:text-gray-400 text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">General Feedback</span>
<input class="invisible w-0" name="feedback-category" type="radio" value="General Feedback"/>
</label>
</div>
</div>
<!-- TextField - Subject -->
<div class="flex flex-col">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#333333] dark:text-gray-200 text-base font-medium leading-normal pb-2">Subject</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded text-[#333333] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-white dark:bg-background-dark/50 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder-gray-500 p-[15px] text-base font-normal leading-normal transition-colors" placeholder="e.g., App crashes when generating images" value=""/>
</label>
</div>
<!-- TextField - Description -->
<div class="flex flex-col flex-grow">
<label class="flex flex-col min-w-40 flex-1 h-full">
<p class="text-[#333333] dark:text-gray-200 text-base font-medium leading-normal pb-2">Description</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded text-[#333333] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-white dark:bg-background-dark/50 focus:border-primary min-h-36 placeholder:text-gray-400 dark:placeholder-gray-500 p-[15px] text-base font-normal leading-normal transition-colors h-full" placeholder="Please describe the issue in detail. Include steps to reproduce it if possible."></textarea>
</label>
</div>
</main>
<!-- Actions -->
<footer class="p-4 pt-2 bg-background-light dark:bg-background-dark">
<!-- SingleButton - Submit -->
<div class="pb-3">
<button class="glossy-button flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 flex-1 w-full text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20">
<span class="truncate">Submit</span>
</button>
</div>
<!-- Cancel Button -->
<div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-5 flex-1 w-full bg-transparent text-primary dark:text-blue-400 text-base font-medium leading-normal tracking-[0.015em] hover:bg-primary/10 transition-colors">
<span class="truncate">Cancel</span>
</button>
</div>
</footer>
</div>
</body></html>
