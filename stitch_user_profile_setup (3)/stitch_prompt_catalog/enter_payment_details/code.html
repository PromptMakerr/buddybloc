<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Credit Card Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .striped-bg {
            background-image: repeating-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.5),
                rgba(255, 255, 255, 0.5) 10px,
                transparent 10px,
                transparent 20px
            );
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#427cf0",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
              "custom-accent": "#5B8DEF", /* Light Blue */
              "custom-panel": "#E9ECEF",
              "custom-text": "#495057",
              "custom-border": "#CFD8DC",
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
                'glossy': '0 4px 15px 0 rgba(91, 141, 239, 0.35)',
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between bg-background-light dark:bg-background-dark">
<button class="text-custom-text dark:text-gray-300 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h2 class="text-custom-text dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Add Card</h2>
</div>
<main class="flex-grow px-4 py-6">
<!-- Card Input Panel -->
<div class="bg-custom-panel dark:bg-gray-800 rounded-lg p-6 striped-bg">
<form action="#" method="POST">
<div class="space-y-6">
<!-- Card Number Field -->
<div class="relative">
<label class="text-custom-text dark:text-gray-300 text-sm font-medium leading-normal pb-2 block" for="card-number">Card Number</label>
<div class="relative">
<input class="form-input w-full rounded-DEFAULT text-custom-text dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-custom-accent border border-custom-border dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-transparent h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" id="card-number" placeholder="0000 0000 0000 0000" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-4">
<svg class="h-6 w-auto text-gray-400" data-alt="Generic Credit Card Icon" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M44,12H4c-1.1,0-2,0.9-2,2v20c0,1.1,0.9,2,2,2h40c1.1,0,2-0.9,2-2V14C46,12.9,45.1,12,44,12z M44,34H4V22h40V34z M44,18H4v-4h40V18z" fill="#5f6368"></path></svg>
</div>
</div>
</div>
<!-- Cardholder Name Field -->
<div>
<label class="text-custom-text dark:text-gray-300 text-sm font-medium leading-normal pb-2 block" for="cardholder-name">Cardholder Name</label>
<input class="form-input w-full rounded-DEFAULT text-custom-text dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-custom-accent border border-custom-border dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-transparent h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" id="cardholder-name" placeholder="John Doe" type="text"/>
</div>
<!-- Expiry and CVV Row -->
<div class="flex flex-row gap-4">
<!-- Expiry Date -->
<div class="flex-1">
<label class="text-custom-text dark:text-gray-300 text-sm font-medium leading-normal pb-2 block" for="expiry-date">Expiry Date</label>
<input class="form-input w-full rounded-DEFAULT text-custom-text dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-custom-accent border border-custom-border dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-transparent h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" id="expiry-date" placeholder="MM/YY" type="text"/>
</div>
<!-- CVV -->
<div class="flex-1">
<label class="flex items-center text-custom-text dark:text-gray-300 text-sm font-medium leading-normal pb-2" for="cvv">
                                    CVV
                                    <span class="material-symbols-outlined text-base text-gray-500 ml-1 cursor-help" title="3 or 4 digits on the back of your card">help_outline</span>
</label>
<input class="form-input w-full rounded-DEFAULT text-custom-text dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-custom-accent border border-custom-border dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-transparent h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" id="cvv" placeholder="•••" type="text"/>
</div>
</div>
</div>
</form>
</div>
</main>
<!-- Footer with CTA and Security text -->
<footer class="p-4 pt-0 mt-auto">
<div class="flex items-center justify-center gap-2 mb-4 text-custom-text dark:text-gray-400">
<span class="material-symbols-outlined text-lg">lock</span>
<p class="text-sm font-normal">Your transaction is encrypted and secure.</p>
</div>
<button class="w-full h-14 rounded-DEFAULT text-white text-lg font-bold bg-custom-accent bg-gradient-to-b from-custom-accent to-[#4A7ADF] shadow-glossy transition-all duration-300 ease-in-out hover:shadow-lg hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-custom-accent/50">
                Confirm Payment
            </button>
</footer>
</div>
</body></html>
