<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prompterion - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glossy-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1));
            border-radius: 9999px 9999px 0 0;
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#427cf0",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
              "prompterion-blue": "#89CFF0",
              "prompterion-bg": "#F5F7FA",
              "prompterion-text": "#333333"
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
                'inner-soft': 'inset 0 2px 4px 0 rgb(0 0 0 / 0.05)',
                'button': '0 4px 14px 0 rgb(137 207 240 / 40%)',
                'button-hover': '0 6px 20px 0 rgb(137 207 240 / 50%)'
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center bg-prompterion-bg p-4 group/design-root overflow-x-hidden">
<div class="flex w-full max-w-sm flex-col items-center">
<!-- Logo -->
<div class="mb-6 flex items-center justify-center space-x-2">
<svg class="text-prompterion-blue" fill="none" height="40" viewbox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2Z" fill="currentColor" fill-opacity="0.2"></path>
<path d="M13 15V17H11V15H13Z" fill="currentColor"></path>
<path d="M13 7V13H11V7H13Z" fill="currentColor"></path>
<path d="M8.46447 8.46447L7.05025 7.05025L8.46447 8.46447Z" fill="currentColor"></path>
<path d="M9.87868 9.87868L7.05025 7.05025" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15.5355 8.46447L14.1213 9.87868L15.5355 8.46447Z" fill="currentColor"></path>
<path d="M16.9497 7.05025L14.1213 9.87868" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-2xl font-bold text-prompterion-text">Prompterion</span>
</div>
<!-- Headline -->
<h1 class="text-prompterion-text tracking-tight text-[32px] font-bold leading-tight text-center pb-8">Welcome Back!</h1>
<!-- Form Container -->
<div class="flex w-full flex-col items-center gap-y-4">
<!-- Email/Username TextField -->
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-prompterion-text text-base font-medium leading-normal pb-2">Email or Username</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-prompterion-text focus:outline-0 focus:ring-2 focus:ring-prompterion-blue/50 border border-gray-200 bg-white h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal shadow-inner-soft transition-shadow duration-200" placeholder="Enter your email or username" value=""/>
</label>
</div>
<!-- Password TextField -->
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-prompterion-text text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl shadow-inner-soft border border-gray-200 focus-within:ring-2 focus-within:ring-prompterion-blue/50 transition-shadow duration-200">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-xl text-prompterion-text focus:outline-0 focus:ring-0 border-0 bg-white h-14 placeholder:text-gray-400 p-[15px] pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-gray-400 flex bg-white items-center justify-center pr-[15px] rounded-r-xl cursor-pointer">
<span class="material-symbols-outlined" style="font-size: 24px;">visibility</span>
</div>
</div>
</label>
</div>
<!-- Login Button -->
<div class="flex w-full pt-4">
<button class="relative flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-5 flex-1 bg-prompterion-blue text-white text-base font-bold leading-normal tracking-[0.015em] shadow-button hover:shadow-button-hover transition-shadow duration-300 transform hover:-translate-y-0.5 glossy-button">
<span class="truncate">Log In</span>
</button>
</div>
<!-- Forgot Password Link -->
<p class="text-prompterion-blue text-sm font-medium leading-normal pb-3 pt-4 text-center cursor-pointer hover:underline">Forgot Password?</p>
</div>
</div>
<!-- Sign Up Link -->
<div class="absolute bottom-8 text-center w-full">
<p class="text-prompterion-text text-sm font-normal leading-normal">
                New to Prompterion? <a class="font-bold text-prompterion-blue hover:underline" href="#">Create Account</a>
</p>
</div>
</div>
</body></html>
