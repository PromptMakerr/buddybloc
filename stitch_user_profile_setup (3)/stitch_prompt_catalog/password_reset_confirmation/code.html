<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Password Reset Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .glossy-button {
            background-image: linear-gradient(to top, #427cf0, #5c8cf2);
            box-shadow: 0 4px 15px 0 rgba(66, 124, 240, 0.35), inset 0 2px 2px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.2s ease-in-out;
        }
        .glossy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(66, 124, 240, 0.45), inset 0 2px 3px 0 rgba(255, 255, 255, 0.3);
        }
        .glossy-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px 0 rgba(66, 124, 240, 0.3), inset 0 2px 2px 0 rgba(255, 255, 255, 0.25);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#427cf0",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- TopAppBar without icon -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="flex size-12 shrink-0 items-center">
<!-- Intentionally empty for spacing -->
</div>
</div>
<div class="flex flex-col items-center justify-center grow px-4">
<!-- Success Icon -->
<div class="flex items-center justify-center h-28 w-28 bg-primary/10 rounded-full mb-8">
<div class="flex items-center justify-center h-20 w-20 bg-primary/20 rounded-full">
<span class="material-symbols-outlined text-5xl text-primary">mark_email_read</span>
</div>
</div>
<!-- HeadlineText -->
<h1 class="text-[#0d121b] dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center pb-3 pt-6">Check Your Email</h1>
<!-- BodyText -->
<p class="text-[#0d121b]/80 dark:text-white/80 text-base font-normal leading-normal pb-3 pt-1 px-4 text-center max-w-sm">
                We've sent an email with instructions on how to reset your password. Please check your spam folder if you don't see it.
            </p>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow"></div>
<!-- SingleButton -->
<div class="flex px-4 py-3 pb-8">
<button class="glossy-button flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 flex-1 text-[#f8f9fc] text-lg font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Back to Login</span>
</button>
</div>
</div>
</body></html>
