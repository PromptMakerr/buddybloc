<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account - Prompterion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#427cf0",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Public Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glossy-button {
            background-image: linear-gradient(to top, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.25));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-[#F8F9FA] group/design-root overflow-x-hidden p-4">
<div class="w-full max-w-md space-y-8">
<div class="text-center">
<h1 class="text-3xl font-bold tracking-tight text-[#374151]">Create Your Account</h1>
<p class="mt-2 text-base text-[#6B7280]">Join Prompterion to start creating.</p>
</div>
<div class="flex w-full flex-col items-center gap-4">
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-sm font-medium leading-normal text-[#374151] pb-2">Username</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#374151] focus:outline-0 border border-gray-200 bg-white focus:ring-2 focus:ring-[#0EA5E9]/50 focus:border-[#0EA5E9] h-14 placeholder:text-gray-400 p-4 text-base font-normal leading-normal shadow-inner" placeholder="Enter your username" value=""/>
</label>
</div>
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-sm font-medium leading-normal text-[#374151] pb-2">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#374151] focus:outline-0 border border-gray-200 bg-white focus:ring-2 focus:ring-[#0EA5E9]/50 focus:border-[#0EA5E9] h-14 placeholder:text-gray-400 p-4 text-base font-normal leading-normal shadow-inner" placeholder="Enter your email address" type="email" value=""/>
</label>
</div>
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-sm font-medium leading-normal text-[#374151] pb-2">Phone Number</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#374151] focus:outline-0 border border-gray-200 bg-white focus:ring-2 focus:ring-[#0EA5E9]/50 focus:border-[#0EA5E9] h-14 placeholder:text-gray-400 p-4 text-base font-normal leading-normal shadow-inner" placeholder="Enter your phone number" type="tel" value=""/>
</label>
</div>
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-sm font-medium leading-normal text-[#374151] pb-2">Password</p>
<div class="relative flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#374151] focus:outline-0 border border-gray-200 bg-white focus:ring-2 focus:ring-[#0EA5E9]/50 focus:border-[#0EA5E9] h-14 placeholder:text-gray-400 p-4 pr-12 text-base font-normal leading-normal shadow-inner" placeholder="Enter your password" type="password" value=""/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#6B7280] hover:text-[#374151]">
<span class="material-symbols-outlined" data-icon="Eye">visibility</span>
</button>
</div>
</label>
</div>
<div class="w-full">
<label class="flex w-full flex-col">
<p class="text-sm font-medium leading-normal text-[#374151] pb-2">Confirm Password</p>
<div class="relative flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#374151] focus:outline-0 border border-gray-200 bg-white focus:ring-2 focus:ring-[#0EA5E9]/50 focus:border-[#0EA5E9] h-14 placeholder:text-gray-400 p-4 pr-12 text-base font-normal leading-normal shadow-inner" placeholder="Confirm your password" type="password" value=""/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#6B7280] hover:text-[#374151]">
<span class="material-symbols-outlined" data-icon="Eye">visibility_off</span>
</button>
</div>
</label>
</div>
</div>
<div class="w-full pt-4">
<button class="glossy-button flex h-14 w-full items-center justify-center rounded-full bg-[#0EA5E9] text-base font-bold text-white shadow-lg shadow-[#0EA5E9]/30 transition-all hover:shadow-xl hover:shadow-[#0EA5E9]/50 hover:brightness-105 active:scale-95">Create Account</button>
</div>
<div class="text-center">
<p class="text-sm text-[#6B7280]">
                    Already have an account? <a class="font-semibold text-[#0EA5E9] hover:underline" href="#">Sign In</a>
</p>
</div>
</div>
<div class="absolute bottom-6 w-full max-w-md px-4 text-center">
<p class="text-xs text-gray-500">By creating an account, you agree to our <a class="font-medium text-gray-600 hover:underline" href="#">Terms of Service</a> and <a class="font-medium text-gray-600 hover:underline" href="#">Privacy Policy</a>.</p>
</div>
</div>

</body></html>
