<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Prompt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
      .striped-bg {
        background-image: repeating-linear-gradient(
          -45deg,
          #EBF5FF,
          #EBF5FF 4px,
          transparent 4px,
          transparent 8px
        );
        background-size: 100%;
        background-color: white;
      }
      .btn-glossy {
        background-image: linear-gradient(to bottom, #67b3f3, #4d9de0);
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#427cf0",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
              "accent": "#4D9DE0",
              "text-primary": "#333333",
              "text-secondary": "#757575",
              "panel-light": "#FFFFFF",
              "panel-stripe": "#EBF5FF"
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "1.25rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }

<style>
    body {
      min-height: max(884px, 100dvh);

  </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background-light font-display">
<div class="relative flex min-h-screen w-full flex-col text-text-primary">
<div class="sticky top-0 z-10 flex items-center bg-background-light/80 p-4 pb-3 backdrop-blur-sm">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-text-primary transition-colors hover:bg-black/5">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-xl font-bold leading-tight tracking-tight pr-10">Edit Prompt</h1>
</div>
<main class="flex-1 space-y-6 px-4 pb-8 pt-2">
<div class="space-y-4 rounded-lg bg-panel-light p-5 shadow-sm striped-bg">
<label class="flex flex-col">
<p class="pb-2 text-base font-medium leading-normal text-text-secondary">Title</p>
<input class="form-input h-14 w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-200 bg-white p-[15px] text-base font-normal leading-normal text-text-primary placeholder:text-text-secondary/60 focus:border-accent focus:outline-0 focus:ring-2 focus:ring-accent/30" value="Epic Fantasy Adventure"/>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium leading-normal text-text-secondary">Description</p>
<textarea class="form-textarea min-h-36 w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-200 bg-white p-[15px] text-base font-normal leading-normal text-text-primary placeholder:text-text-secondary/60 focus:border-accent focus:outline-0 focus:ring-2 focus:ring-accent/30">Create a detailed and immersive description of a fantasy world, including its geography, cultures, and magical systems. The prompt should guide the AI to generate rich lore and compelling characters for a novel or role-playing game setting.</textarea>
</label>
<label class="flex flex-col">
<p class="pb-2 text-base font-medium leading-normal text-text-secondary">Usage Instructions</p>
<textarea class="form-textarea min-h-36 w-full flex-1 resize-none overflow-hidden rounded-lg border border-gray-200 bg-white p-[15px] text-base font-normal leading-normal text-text-primary placeholder:text-text-secondary/60 focus:border-accent focus:outline-0 focus:ring-2 focus:ring-accent/30">To use this prompt, specify the key elements you want to focus on, such as a particular kingdom, a specific type of magic, or a historical event. For best results, provide a few keywords like "ancient ruins," "dragon riders," or "elemental mages."</textarea>
</label>
</div>
<div class="space-y-4 rounded-lg bg-panel-light p-5 shadow-sm striped-bg">
<h3 class="text-lg font-bold leading-tight tracking-tight text-text-primary">Visual Example</h3>
<div class="space-y-4">
<div class="hidden flex-col items-center justify-center gap-2 rounded-lg border-2 border-dashed border-gray-300 bg-white p-8 text-center">
<div class="flex size-14 items-center justify-center rounded-full bg-accent/10">
<span class="material-symbols-outlined text-4xl text-accent">upload_file</span>
</div>
<p class="font-medium text-text-primary">Tap to upload a photo</p>
<p class="text-sm text-text-secondary">Or drag and drop</p>
</div>
<div class="space-y-4">
<div class="relative overflow-hidden rounded-lg">
<img alt="Fantasy world example" class="aspect-video w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrm4SdQNEGLou8SXkBcLTeaaPtLn-ZpyrHUUlUK2cCUNZBxtR7Qdw7zxJZSaYFxzRzq7bSCeIynuwh9ivMBHBCERv5SzPlfhnasf7gMueEaaq2c09GKHzVqxq2K1GlB1KsN37l1DurDw3ul3y_RHvlJGMJuAs-FGMh6N7VyhIaeOfMnicSHB2SRn8M_BjjCnoTJDm_LWn9JjogUaI3aKzZnc8WKli9BS2oDitiKQC3Gq_BRHUx5WxNB2WgXXVHwKJjT8r3-XqKPPq-"/>
<div class="absolute inset-0 bg-black/20"></div>
<div class="absolute bottom-3 right-3 flex items-center gap-2">
<button class="flex h-10 items-center gap-2 rounded-full bg-white/90 px-4 text-sm font-medium text-text-primary shadow-md backdrop-blur-sm transition-transform hover:scale-105">
<span class="material-symbols-outlined text-lg">edit</span>
<span>Change</span>
</button>
<button class="flex size-10 items-center justify-center rounded-full bg-white/90 text-sm font-medium text-red-500 shadow-md backdrop-blur-sm transition-transform hover:scale-105">
<span class="material-symbols-outlined text-lg">delete</span>
</button>
</div>
</div>
</div>
</div>
</div>
<div class="space-y-4 rounded-lg bg-panel-light p-5 shadow-sm striped-bg">
<div class="flex items-center justify-between">
<h3 class="text-lg font-bold leading-tight tracking-tight text-text-primary">Tags / Categories</h3>
<button class="flex items-center gap-1.5 rounded-full bg-accent/10 px-3 py-1.5 text-sm font-medium text-accent transition-transform hover:scale-105">
<span class="material-symbols-outlined text-lg">add_circle</span>
<span>Edit</span>
</button>
</div>
<div class="flex flex-wrap gap-2 pt-2">
<span class="inline-flex items-center gap-1 rounded-full bg-accent/20 px-3 py-1 text-sm font-medium text-accent">Fantasy</span>
<span class="inline-flex items-center gap-1 rounded-full bg-accent/20 px-3 py-1 text-sm font-medium text-accent">World-Building</span>
<span class="inline-flex items-center gap-1 rounded-full bg-accent/20 px-3 py-1 text-sm font-medium text-accent">Creative Writing</span>
<span class="inline-flex items-center gap-1 rounded-full bg-accent/20 px-3 py-1 text-sm font-medium text-accent">RPG</span>
</div>
</div>
<div class="space-y-4 rounded-lg bg-panel-light p-5 shadow-sm striped-bg">
<h3 class="text-lg font-bold leading-tight tracking-tight text-text-primary">Compatible AI Models</h3>
<div class="space-y-3 pt-1">
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg bg-white p-3 ring-1 ring-inset ring-gray-200 has-[:checked]:bg-accent/10 has-[:checked]:ring-accent">
<span class="font-medium text-text-primary">GPT-4 Turbo</span>
<input checked="" class="form-checkbox h-5 w-5 rounded-md border-gray-300 text-accent focus:ring-accent/50" type="checkbox"/>
</label>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg bg-white p-3 ring-1 ring-inset ring-gray-200 has-[:checked]:bg-accent/10 has-[:checked]:ring-accent">
<span class="font-medium text-text-primary">Claude 3 Opus</span>
<input checked="" class="form-checkbox h-5 w-5 rounded-md border-gray-300 text-accent focus:ring-accent/50" type="checkbox"/>
</label>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg bg-white p-3 ring-1 ring-inset ring-gray-200 has-[:checked]:bg-accent/10 has-[:checked]:ring-accent">
<span class="font-medium text-text-primary">Gemini 1.5 Pro</span>
<input class="form-checkbox h-5 w-5 rounded-md border-gray-300 text-accent focus:ring-accent/50" type="checkbox"/>
</label>
</div>
</div>
</main>
<footer class="sticky bottom-0 z-10 w-full bg-background-light/80 px-4 py-4 backdrop-blur-sm">
<div class="space-y-3">
<button class="btn-glossy w-full rounded-lg py-4 text-center text-base font-bold text-white shadow-lg shadow-accent/30 transition-transform duration-200 ease-in-out hover:scale-[1.03] hover:shadow-xl hover:shadow-accent/40 focus:outline-none focus:ring-4 focus:ring-accent/50">Save Changes</button>
<button class="w-full rounded-lg py-3 text-center text-base font-medium text-text-secondary transition-colors hover:bg-black/5 focus:outline-none focus:ring-4 focus:ring-accent/50">Cancel</button>
</div>
</footer>
</div>
</body></html>
