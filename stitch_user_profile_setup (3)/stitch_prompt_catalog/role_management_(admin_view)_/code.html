<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Role</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .striped-panel {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.5),
                rgba(255, 255, 255, 0.5) 10px,
                transparent 10px,
                transparent 20px
            );
        }
        .btn-glossy {
            background-image: linear-gradient(to top, rgba(255,255,255,0), rgba(255,255,255,0.3));
        }
        .toggle-switch-shadow {
             box-shadow: rgba(0, 0, 0, 0.15) 0px 3px 8px, rgba(0, 0, 0, 0.06) 0px 3px 1px;
        }
    </style>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2b6cee",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-200/80 bg-background-light/80 p-4 pb-3 backdrop-blur-sm dark:border-slate-800/80 dark:bg-background-dark/80">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-slate-700 hover:bg-slate-200 dark:text-slate-300 dark:hover:bg-slate-800">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-bold text-slate-900 dark:text-slate-100">Create New Role</h1>
<div class="w-10 shrink-0"></div> <!-- Spacer -->
</div>
<main class="flex-grow px-4 pt-6 pb-28">
<!-- Input Card -->
<div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900/50">
<label class="flex flex-col">
<p class="pb-2 text-base font-medium text-slate-800 dark:text-slate-200">Role Name</p>
<input class="form-input flex h-14 w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light p-[15px] text-base font-normal leading-normal text-slate-900 placeholder:text-slate-400 focus:border-primary focus:outline-0 focus:ring-2 focus:ring-primary/30 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-primary" placeholder="e.g., Content Moderator" value=""/>
</label>
</div>
<!-- Permissions Panel -->
<div class="mt-8">
<h2 class="text-lg font-bold text-slate-900 dark:text-slate-100">Permissions</h2>
<div class="mt-4 space-y-6">
<!-- User Management Group -->
<div>
<h3 class="mb-3 text-base font-semibold text-slate-600 dark:text-slate-400">User Management</h3>
<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900/50">
<div class="striped-panel absolute inset-0 z-0 bg-primary/5 dark:bg-primary/10"></div>
<div class="relative z-10 divide-y divide-slate-200 dark:divide-slate-800">
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">Create &amp; Delete Users</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">Edit User Profiles</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">Assign Roles</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</div>
</div>
</div>
<!-- Content Moderation Group -->
<div>
<h3 class="mb-3 text-base font-semibold text-slate-600 dark:text-slate-400">Content Moderation</h3>
<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900/50">
<div class="striped-panel absolute inset-0 z-0 bg-primary/5 dark:bg-primary/10"></div>
<div class="relative z-10 divide-y divide-slate-200 dark:divide-slate-800">
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">Approve &amp; Reject Content</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">Edit User-Generated Content</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</div>
</div>
</div>
<!-- Analytics Group -->
<div>
<h3 class="mb-3 text-base font-semibold text-slate-600 dark:text-slate-400">Analytics</h3>
<div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900/50">
<div class="striped-panel absolute inset-0 z-0 bg-primary/5 dark:bg-primary/10"></div>
<div class="relative z-10 divide-y divide-slate-200 dark:divide-slate-800">
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">View Dashboard Analytics</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="flex min-h-14 items-center justify-between gap-4 p-4">
<p class="flex-1 truncate text-base font-normal text-slate-800 dark:text-slate-200">Export Reports</p>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-slate-200 p-0.5 has-[:checked]:bg-primary dark:bg-slate-700">
<div class="h-full w-[27px] rounded-full bg-white transition-transform duration-200 ease-in-out toggle-switch-shadow"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Action Buttons Footer -->
<div class="fixed bottom-0 left-0 right-0 z-10 border-t border-slate-200/80 bg-background-light/80 p-4 backdrop-blur-sm dark:border-slate-800/80 dark:bg-background-dark/80">
<div class="flex gap-4">
<button class="h-14 flex-1 items-center justify-center rounded-full bg-slate-200 text-base font-bold text-slate-700 shadow-md transition-transform duration-200 hover:scale-105 hover:bg-slate-300 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600">Cancel</button>
<button class="btn-glossy h-14 flex-1 items-center justify-center rounded-full bg-primary text-base font-bold text-white shadow-lg shadow-primary/30 transition-transform duration-200 hover:scale-105 hover:brightness-110">Create Role</button>
</div>
</div>
</div>
</body></html>
