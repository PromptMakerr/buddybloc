<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BuddyBloc - Create Your Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4F46E5",
                        "primary-hover": "#4338CA",
                        "background-light": "#F9FAFB",
                        "background-dark": "#111827",
                        "text-light": "#1F2937",
                        "text-dark": "#F9FAFB",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1F2937",
                        "border-light": "#E5E7EB",
                        "border-dark": "#374151",
                        "muted-light": "#6B7280",
                        "muted-dark": "#9CA3AF",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="font-display bg-background-dark text-text-dark">
<div class="flex min-h-screen w-full items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-4xl rounded-xl bg-card-dark border border-border-dark shadow-2xl">
<div class="p-6 sm:p-8 md:p-10">
<div class="mb-8 text-center">
<h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-text-dark">Create Your BuddyBloc Profile</h1>
<p class="mt-2 text-base text-muted-dark">Tell us about yourself to find the perfect work buddy.</p>
</div>
<form>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-8">
<div class="flex flex-col gap-6">
<div class="flex items-center gap-4">
<img alt="User profile picture" class="h-20 w-20 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAdFgvLoFhnxxYt-3mZ29ec21gUZ9RowjNEg0kUyeizRLeOKWdHPo0zu5NTt6l4IUIVlpIUoUXU3tuVUAaTsj55nXLrUX0C8jwaUKN_WFQ_6oH-ApUqTbgyw_IkIzF1ogAmgqH9Kkk0bBuyGKQrrIOP0AWrwXOe1H983TVhM51h_xFmGLT7KTmBTtq_fN_Xis_ASagA1Bi6mmSo8i3GSWLr4C506rhhxS6mAedeHRtLJhG-bwnomozB2hY1sgyF230wsqs6XRJ9dlV"/>
<div>
<h2 class="text-lg font-bold text-text-dark">Profile Photo</h2>
<p class="text-sm text-muted-dark">A friendly face helps!</p>
<div class="mt-2">
<button class="text-sm font-semibold text-primary hover:text-primary-hover" type="button">Change</button>
<button class="ml-3 text-sm font-semibold text-muted-dark hover:text-text-dark" type="button">Remove</button>
</div>
</div>
</div>
<div>
<label class="block text-sm font-medium leading-6 text-text-dark" for="name">Full Name</label>
<div class="mt-2">
<input class="form-input block w-full rounded-lg border-0 bg-white/5 py-2.5 px-3.5 text-text-dark shadow-sm ring-1 ring-inset ring-border-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="name" name="name" placeholder="e.g., Jane Doe" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium leading-6 text-text-dark" for="headline">Headline</label>
<div class="mt-2">
<input class="form-input block w-full rounded-lg border-0 bg-white/5 py-2.5 px-3.5 text-text-dark shadow-sm ring-1 ring-inset ring-border-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="headline" name="headline" placeholder="e.g., Senior Product Designer" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium leading-6 text-text-dark" for="bio">Short Bio</label>
<div class="mt-2">
<textarea class="form-textarea block w-full rounded-lg border-0 bg-white/5 py-2.5 px-3.5 text-text-dark shadow-sm ring-1 ring-inset ring-border-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="bio" name="bio" placeholder="Tell us a little about your work and interests." rows="4"></textarea>
</div>
</div>
</div>
<div class="flex flex-col gap-6">
<div>
<label class="block text-sm font-medium leading-6 text-text-dark" for="timezone">Timezone</label>
<div class="mt-2">
<select class="form-select block w-full rounded-lg border-0 bg-white/5 py-2.5 pl-3.5 pr-10 text-text-dark ring-1 ring-inset ring-border-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="timezone" name="timezone">
<option selected="">(GMT-05:00) Eastern Time</option>
<option>(GMT-08:00) Pacific Time</option>
<option>(GMT+01:00) Central European Time</option>
</select>
</div>
</div>
<div>
<label class="block text-sm font-medium leading-6 text-text-dark">Work Style Preference</label>
<p class="text-sm text-muted-dark">How do you prefer to collaborate?</p>
<div class="mt-3 space-y-3">
<div class="flex items-center gap-x-3">
<input checked="" class="form-checkbox h-4 w-4 rounded bg-white/10 border-border-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="style-camera" name="style-camera" type="checkbox"/>
<label class="block text-sm leading-6 text-text-dark" for="style-camera">Camera on during sessions</label>
</div>
<div class="flex items-center gap-x-3">
<input class="form-checkbox h-4 w-4 rounded bg-white/10 border-border-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="style-chat" name="style-chat" type="checkbox"/>
<label class="block text-sm leading-6 text-text-dark" for="style-chat">Frequent check-ins via chat</label>
</div>
<div class="flex items-center gap-x-3">
<input checked="" class="form-checkbox h-4 w-4 rounded bg-white/10 border-border-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="style-focus" name="style-focus" type="checkbox"/>
<label class="block text-sm leading-6 text-text-dark" for="style-focus">Quiet, focused work sessions</label>
</div>
</div>
</div>
<div>
<label class="block text-sm font-medium leading-6 text-text-dark" for="goals">Your Goals</label>
<p class="text-sm text-muted-dark">What do you want to achieve with a buddy?</p>
<div class="mt-2">
<textarea class="form-textarea block w-full rounded-lg border-0 bg-white/5 py-2.5 px-3.5 text-text-dark shadow-sm ring-1 ring-inset ring-border-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="goals" name="goals" placeholder="e.g., Stay accountable on my new project, learn a new skill, have social connection during the work day." rows="4"></textarea>
</div>
</div>
</div>
</div>
<div class="mt-10 pt-8 border-t border-border-dark flex justify-end">
<button class="flex items-center justify-center rounded-lg bg-primary px-6 py-3 text-sm font-semibold text-white shadow-sm hover:bg-primary-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" type="submit">
                        Complete Profile &amp; Find Buddies
                        <span class="material-symbols-outlined ml-2 !text-xl">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</div>

</body></html>
